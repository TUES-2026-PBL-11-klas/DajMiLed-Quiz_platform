# ==============================
# Vault Connection
# (only VAULT_TOKEN comes from your local env — everything else is read FROM Vault)
# ==============================
spring.cloud.vault.host=${SPRING_CLOUD_VAULT_HOST:localhost}
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN}

# KV v2 engine – reads secrets from  secret/data/dev
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=dev
spring.cloud.vault.kv.application-name=dev

spring.config.activate.on-profile=!test
# Pull all KV pairs from Vault before resolving the rest of this file
spring.config.import=optional:vault://

# Fail fast if Vault is unreachable on startup
spring.cloud.vault.fail-fast=true

# ==============================
# App Metadata
# ==============================
spring.application.name=${SPRING_APPLICATION_NAME}

# ==============================
# Database (injected via Vault → secret/dev)
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ==============================
# JPA & Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ==============================
# JWT (injected via Vault → secret/dev)
# ==============================
jwt.secret=${JWT_SECRET}
expiration.ms=${EXPIRATIONMS}

# ==============================
# Cloudinary (injected via Vault → secret/dev)
# ==============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==============================
# Hikari Connection Pool
# ==============================
spring.datasource.hikari.maximum-pool-size=1000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ==============================
# Logging
# ==============================
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn
logging.level.org.apache.pdfbox.pdmodel.font.PDType1Font=OFF
logging.level.org.apache.fontbox=OFF

# ==============================
# Actuator / Health
# ==============================
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ==============================
# CORS – allowed origins (injected via Vault → secret/dev)
# ==============================
app.cors.allowed-origins=${ALLOWED_ORIGINS}


# ==============================
# AI Question Service (injected via Vault → secret/dev)
# ==============================
ai.service.url=${AI_SERVICE_URL}