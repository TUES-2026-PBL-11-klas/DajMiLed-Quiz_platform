spring.application.name=server-test

# Disable Vault completely for tests
spring.cloud.vault.enabled=false
spring.cloud.vault.kv.enabled=false
spring.cloud.vault.fail-fast=false
spring.config.import=

# Provide dummy/test values for everything that usually comes from Vault
SPRING_APPLICATION_NAME=server-test
VAULT_TOKEN=dummy_token

# Datasource
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb
SPRING_DATASOURCE_USERNAME=sa
SPRING_DATASOURCE_PASSWORD=

# JWT
jwt.secret=supersecretkeyformocktestingsupersecretkeyformocktesting123
expiration.ms=3600000
JWT_SECRET=supersecretkeyformocktestingsupersecretkeyformocktesting123
EXPIRATIONMS=3600000

# Cloudinary
cloudinary.cloud-name=mock_cloud
cloudinary.api-key=mock_key
cloudinary.api-secret=mock_secret
CLOUDINARY_CLOUD_NAME=mock_cloud
CLOUDINARY_API_KEY=mock_key
CLOUDINARY_API_SECRET=mock_secret

# CORS
ALLOWED_ORIGINS=*
app.cors.allowed-origins=*

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100