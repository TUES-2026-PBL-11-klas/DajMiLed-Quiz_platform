name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ${{ github.sha }}
      vault-url:
        required: true
        type: string
      vault-role:
        required: true
        type: string
      vault-secret-path:
        required: false
        type: string
        default: secret/data/docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        id: vault
        with:
          url: ${{ inputs.vault-url }}
          method: jwt
          role: ${{ inputs.vault-role }}
          secrets: |
            ${{ inputs.vault-secret-path }} username | DOCKERHUB_USERNAME ;
            ${{ inputs.vault-secret-path }} token | DOCKERHUB_TOKEN

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.vault.outputs.DOCKERHUB_USERNAME }}
          password: ${{ steps.vault.outputs.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vault.outputs.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max