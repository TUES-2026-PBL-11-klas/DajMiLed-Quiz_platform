image:
  repository: dajmiled/quiz-server
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: quiz.localhost

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

frontend:
  enabled: true
  image:
    repository: dajmiled/quiz-frontend
    tag: latest
    pullPolicy: Always

evaluationService:
  enabled: true
  replicaCount: 1
  image:
    repository: dajmiled/quiz-evaluation-service
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

questionGenerationService:
  enabled: true
  replicaCount: 1
  image:
    repository: dajmiled/quiz-question-generation-service
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
