image:
  repository: dajmiled/quiz-server
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: quiz.localhost

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

frontend:
  enabled: true
  image:
    repository: dajmiled/quiz-frontend
    tag: latest
    pullPolicy: IfNotPresent

postgresql:
  auth:
    username: ""  
    password: ""    
    database: ""  
  persistence:
    size: 1Gi

