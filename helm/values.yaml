image:
  repository: dajmiled/quiz-server
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: quiz.localhost

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

frontend:
  enabled: true
  image:
    repository: dajmiled/quiz-frontend
    tag: latest
    pullPolicy: Always

postgresql:
  auth:
    username: postgres
    password: postgres
    database: quizdb
